name: Deploy a Hostinger

# Cada push a `main` compila el sitio y publica SOLO el contenido de `dist/` en la rama `hostinger`
# (historia de un único commit, se pisa en cada deploy). Hostinger tiene esa rama conectada en
# hPanel → Avanzado → Git (repo público, sin llaves) con auto-deploy por webhook: cuando la rama
# cambia, Hostinger la baja a la carpeta `public_html` del sitio.
#
# Por qué así y no por SSH/FTP desde acá: Hostinger no deja entrar a las IP de los runners de GitHub
# (el SSH hace timeout), y Hostinger tampoco compila Astro. La rama `hostinger` nunca se edita a mano.
#
# Variable opcional (`gh variable set`): SITE_URL = URL pública, para canonical/sitemap.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Chrome rechaza `animation` con scroll()/timeline dentro del shorthand
        run: |
          if grep -rhoE 'animation:[^;}]*(scroll\(|--(que|como|donde|cierre)[a-z-]*)' dist/_astro/*.css dist/index.html; then
            echo "::error::El minificador fusionó animation-timeline dentro del shorthand animation"
            exit 1
          fi
      - name: Publicar dist/ en la rama hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger
