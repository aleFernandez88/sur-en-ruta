name: Deploy a GitHub Pages (manual, respaldo)

# Desde 2026-11-03 el deploy automático es a Hostinger (deploy-hostinger.yml). Este queda solo a mano
# (workflow_dispatch) y compila con base '/sur-en-ruta/', que es donde sirve GitHub Pages de proyecto.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://alefernandez88.github.io
      BASE_PATH: /sur-en-ruta/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar, construir y subir el sitio
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages (manual, respaldo)

# Desde 2026-11-03 el deploy automático es a Hostinger (deploy-hostinger.yml). Este queda solo a mano
# (workflow_dispatch) y compila con base '/sur-en-ruta/', que es donde sirve GitHub Pages de proyecto.
        id: deployment
        uses: actions/deploy-pages@v4
