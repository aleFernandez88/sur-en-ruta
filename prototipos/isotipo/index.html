<!-- ============ VARIANTE B — Ruta + pin, geométrica y mínima ============ -->

      <figcaption>Sin paisaje — solo la ruta serpenteando hacia el pin. Muy legible chica.</figcaption>

</div>

      <figcaption>Abstracto: una sola línea gruesa, ruta Y letra "S" a la vez. El punto final es el pin, reducido a un punto.</figcaption>

</div>
