<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sur en Ruta — App (showcase)</title>
<!--
  Escena para filmar/renderizar un video de 10 s: el celular con el mockup real adentro
  (public/app-demo/index.html vía <iframe>), sobre fondo oscuro de la paleta (--marino-profundo),
  girando en 3D mientras el contenido de la pantalla scrollea solo.

  - Prototipo descartable (prototipos/ no se publica, ver CLAUDE.md §8).
  - El contenido de pantalla es EXACTAMENTE el mockup, no algo generado con IA — por eso es fiel.
  - Se sirve desde el mismo dev server de Astro que el mockup (mismo origen → el <iframe> se puede
    manejar desde acá). Abrir en:
      http://localhost:4321/sur-en-ruta/app-demo/showcase.html   (se anima solo, para grabar a mano)
      ...?manual   (no se anima: lo maneja el script de render, render/render.mjs)
  - El <iframe> apunta a ../../public/... NO: se sirve como /sur-en-ruta/app-demo/index.html.
    Como este archivo vive en prototipos/ pero se abre por la ruta servida, uso ruta relativa
    "index.html" que resuelve a /sur-en-ruta/app-demo/index.html SOLO si este showcase se copia a
    public/app-demo/. Para no depender de eso, el src se setea por JS desde location.
-->
<style>
  :root{
    --marino:#0f2b4d;
    --marino-profundo:#0a2036;
    --marino-noche:#050b14;
    --celeste:#6cace4;
    --verde:#5a6b2e;
    --arena:#e7dfc9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--marino-noche);}

  #scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:radial-gradient(140% 100% at 50% 38%, #163a5c 0%, #0a2036 46%, #050b14 100%);
    background-color:var(--marino-profundo);
    display:grid;
    place-items:center;
  }

  /* halo de luz detrás del celular */
  #glow{
    position:absolute;
    width:82%;
    aspect-ratio:1;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(108,172,228,0.32) 0%, rgba(108,172,228,0.12) 33%, transparent 66%);
    filter:blur(26px);
    pointer-events:none;
  }
  #glow.b{
    background:radial-gradient(circle, rgba(90,107,46,0.20) 0%, transparent 60%);
    width:60%;
    top:58%;
  }
  /* viñeta oscura en los bordes */
  #vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 40%, rgba(3,7,14,0.55) 100%);
  }

  #stageWrap{
    position:relative;
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    perspective:1700px;
    perspective-origin:50% 44%;
  }

  /* sombra de contacto en el "piso" */
  #floor{
    position:absolute;
    left:50%;
    top:50%;
    width:46%;
    height:9%;
    background:radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
    filter:blur(14px);
    transform:translate(-50%, 620%);
    pointer-events:none;
  }

  #phone{
    position:relative;
    height:82%;
    aspect-ratio:9 / 17;
    transform-style:preserve-3d;
    will-change:transform;
  }
  /* modo captura plana: el celular de frente, un poco más grande */
  #phone.plano{ height:90%; }

  #phoneBody{
    position:absolute;
    inset:0;
    border-radius:13.5% / 6.2%;
    background:
      linear-gradient(135deg, #3a4048 0%, #10131a 38%, #2c313a 62%, #0c0f15 100%);
    padding:1.7%;
    /* Solo bisel interno — el gran box-shadow exterior que había acá (2 capas, 0 60px 120px y
       0 20px 50px) NO rota junto con #phone bajo transform-style:preserve-3d: Chrome lo
       compone en el plano de frente y lo va re-rasterizando con retraso mientras el celular
       gira, así que queda un "fantasma" rectangular de la silueta de frente detrás del celular
       ya girado, que se desvanece de a poco (reportado por Ale, verificado en vivo 2026-09-22).
       #glow + #floor ya dan la sensación de elevación/flotación sin este problema. */
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.10),
      inset 0 2px 6px rgba(255,255,255,0.16),
      inset 0 -3px 8px rgba(0,0,0,0.5);
  }

  #screen{
    position:absolute;
    inset:1.7%;
    border-radius:11.5% / 5.4%;
    overflow:hidden;
    background:#f1f0ee;
    box-shadow:inset 0 0 0 2px #05080d;
  }
  /* el iframe se renderiza SIEMPRE a 390px de ancho (el ancho para el que está diseñado el
     mockup) y se escala para calzar en la pantalla — así el layout no depende del tamaño del
     celular en la escena. `--fit` y la altura los setea el JS. */
  #screen iframe{
    width:390px;
    border:0;
    display:block;
    transform-origin:top left;
    transform:scale(var(--fit,1));
  }

  /* isla dinámica */
  #island{
    position:absolute;
    left:50%;
    top:1.5%;
    width:20%;
    height:1.9%;
    background:#05080d;
    border-radius:999px;
    transform:translateX(-50%);
    z-index:3;
    pointer-events:none;
  }

  /* indicador de "toque" sobre la pantalla */
  #tap{
    position:absolute;
    left:50%;
    top:85%;
    width:15%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    z-index:5;
    pointer-events:none;
    opacity:0;
  }
  #tapRing{
    position:absolute;
    inset:0;
    border-radius:999px;
    border:3px solid rgba(255,255,255,0.95);
    box-shadow:0 0 12px rgba(108,172,228,0.9);
  }
  #tapDot{
    position:absolute;
    left:50%;top:50%;
    width:34%;aspect-ratio:1;
    border-radius:999px;
    background:rgba(255,255,255,0.85);
    transform:translate(-50%,-50%);
  }

  /* === Modo "transparente" (?fondo=transparente) — para prototipos/app-demo/render/scrub.mjs ===
   * El scrub de P1 (docs/planes/2026-09-04-reescritura-index-p1-p5.md §15, ajuste 2026-09-04) NO
   * hornea el fondo en el frame: el <canvas> se dibuja sobre el mismo degradé que ya tiene .p1
   * como CSS (P1QueEs.astro), así el celular "flota" de verdad sobre lo que sea que haya detrás,
   * sin depender de que los dos degradés (el del frame y el del contenedor) calcen. Se saca el
   * fondo del propio #scene (Puppeteer captura con `omitBackground:true`) y se apaga #vignette
   * (oscurece bordes contra un fondo opaco — no tiene sentido sin uno). #glow y #floor SE
   * CONSERVAN: son el aura y la sombra de contacto que hacen que el celular se lea flotando, no
   * "cortado" a su silueta exacta.
   * COSTO REAL (corrige una medición mal hecha del mismo día, ver el comentario grande en
   * prototipos/app-demo/render/scrub.mjs): con esta escena, la transparencia real pesa ~7,4 MB el
   * set completo (90 frames × 900×1350), contra ~3,4 MB de la versión con fondo horneado — no
   * "prácticamente igual" como decía una medición anterior rota (comparaba contra un frame que en
   * realidad seguía opaco, por dos bugs: showcase.html sin sincronizar a public/, y el fondo de
   * html/body sin apagar — los dos ya corregidos acá). Ale decidió el 2026-09-04 mantener la
   * transparencia con ese costo.
   */
  /* html Y body, no solo body: html,body{background:var(--marino-noche)} más arriba en este mismo
   * archivo es OPACO — con solo #scene transparente, ese fondo de html/body seguía tapando todo
   * (bug real, encontrado en vivo: el canal alfa daba 255 en toda la imagen). La clase se agrega
   * a los dos elementos por JS, ver más abajo. */
  html.fondo-transparente,
  body.fondo-transparente,
  body.fondo-transparente #scene{ background:transparent; }
  body.fondo-transparente #vignette{ display:none; }

  /* reflejo / glare que se mueve con el giro */
  #glare{
    position:absolute;
    inset:0;
    border-radius:13.5% / 6.2%;
    background:linear-gradient(115deg,
      rgba(255,255,255,0.16) 0%,
      rgba(255,255,255,0.05) 18%,
      transparent 38%,
      transparent 68%,
      rgba(255,255,255,0.04) 86%,
      rgba(255,255,255,0.12) 100%);
    mix-blend-mode:screen;
    pointer-events:none;
    z-index:4;
    will-change:transform,opacity;
  }
</style>
</head>
<body>
<div id="scene">
  <div id="glow"></div>
  <div id="glow" class="b"></div>
  <div id="vignette"></div>
  <div id="stageWrap">
    <div id="floor"></div>
    <div id="phone">
      <div id="phoneBody">
        <div id="screen"><iframe id="app" scrolling="no" title="Sur en Ruta app"></iframe></div>
        <div id="island"></div>
        <div id="tap"><div id="tapRing"></div><div id="tapDot"></div></div>
        <div id="glare"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var DUR = 10;                       // segundos, loopea
  var phone  = document.getElementById('phone');
  var glare  = document.getElementById('glare');
  var iframe = document.getElementById('app');

  // el mockup se sirve como .../app-demo/index.html — mismo directorio que este showcase servido
  iframe.src = new URL('index.html', location.href).href;

  // recorrido: arranca en MAPA arriba (se ve "SUR EN RUTA" + logo), baja con scroll, "toca" para
  // pasar a RUTAS, y sigue bajando en Rutas. Siempre hacia abajo, nunca vuelve.
  var scr = { mapa: null, rutas: null };
  var nav = { mapa: null, rutas: null };
  var maxS = { mapa: 0, rutas: 0 };
  var tapEl = document.getElementById('tap');
  var tapRing = document.getElementById('tapRing');
  var tapDot = document.getElementById('tapDot');
  window.__ready = false;

  // hitos del recorrido, en fracción de DUR (0..1)
  var T = {
    mapaHold:  0.12,   // 0.0 – 1.2s : mapa arriba, quieto
    mapaScroll:0.44,   // 1.2 – 4.4s : baja el mapa
    tapIn:     0.44,   // 4.4s       : aparece el toque
    switch:    0.49,   // 4.9s       : cambia a Rutas
    tapOut:    0.54,   // 5.4s       : desaparece el toque
    rutasHold: 0.60,   // 4.9 – 6.0s : rutas arriba, quieto
    rutasEnd:  0.94    // 6.0 – 9.4s : baja Rutas; 9.4–10s queda abajo
  };

  // ajusta el iframe a 390px de ancho lógico y lo escala para llenar la pantalla del celular
  var screenEl = document.getElementById('screen');
  function ajustarIframe(){
    var w = screenEl.clientWidth, h = screenEl.clientHeight;
    if (!w || !h) return;
    var fit = w / 390;
    iframe.style.setProperty('--fit', fit);
    iframe.style.height = Math.ceil(h / fit) + 'px';
  }
  new ResizeObserver(ajustarIframe).observe(screenEl);
  ajustarIframe();

  function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

  function setSceneTime(t){
    var p = (t % DUR) / DUR;                 // 0..1
    var w = Math.sin(p * Math.PI * 2);       // -1..1, vuelve a 0 en p=0 y p=1  → loop limpio
    var ry = w * 23;
    var rx = 3.5 + Math.cos(p * Math.PI * 2) * 1.6;
    var ty = Math.sin(p * Math.PI * 2 + Math.PI / 3) * 1.1;   // bob sutil (%)
    phone.style.transform =
      'translateY(' + ty.toFixed(3) + '%) rotateX(' + rx.toFixed(3) + 'deg) rotateY(' +
      ry.toFixed(3) + 'deg) rotateZ(' + (w * -1.1).toFixed(3) + 'deg)';
    glare.style.transform = 'translateX(' + (w * 16).toFixed(2) + '%)';
    glare.style.opacity = (0.42 + 0.36 * Math.abs(w)).toFixed(3);

    if (!scr.mapa || !scr.rutas) return;

    // medición perezosa por si el layout todavía no estaba listo
    if (maxS.mapa <= 0)  maxS.mapa  = scr.mapa.scrollHeight  - scr.mapa.clientHeight;
    if (maxS.rutas <= 0) maxS.rutas = scr.rutas.scrollHeight - scr.rutas.clientHeight;

    // transición determinista mapa→rutas: push estilo iOS (Rutas entra desde la derecha, el Mapa
    // sale un poco a la izquierda y se oscurece). Las 2 pantallas quedan .activa siempre; el
    // movimiento lo maneja el transform inline → render frame-a-frame reproducible.
    var slideA = T.switch - 0.035, slideB = T.switch + 0.010;
    var sl = p < slideA ? 0 : p > slideB ? 1 : (p - slideA) / (slideB - slideA);
    var slE = easeInOut(sl);
    scr.mapa.style.transform  = 'translateX(' + (slE * -22).toFixed(2) + '%)';
    scr.mapa.style.filter     = 'brightness(' + (1 - slE * 0.28).toFixed(3) + ')';
    scr.rutas.style.transform = 'translateX(' + ((1 - slE) * 100).toFixed(2) + '%)';
    var enRutas = slE >= 0.5;
    if (nav.mapa)  nav.mapa.classList.toggle('activo', !enRutas);
    if (nav.rutas) nav.rutas.classList.toggle('activo', enRutas);

    // --- scroll del MAPA (fase 1) ---
    if (p < T.mapaHold)          scr.mapa.scrollTop = 0;
    else if (p < T.mapaScroll)   scr.mapa.scrollTop = easeInOut((p - T.mapaHold) / (T.mapaScroll - T.mapaHold)) * maxS.mapa;
    else                         scr.mapa.scrollTop = maxS.mapa;

    // --- scroll de RUTAS (fase 2) ---
    if (p < T.rutasHold)         scr.rutas.scrollTop = 0;
    else if (p < T.rutasEnd)     scr.rutas.scrollTop = easeInOut((p - T.rutasHold) / (T.rutasEnd - T.rutasHold)) * maxS.rutas;
    else                         scr.rutas.scrollTop = maxS.rutas;

    // --- indicador de toque ---
    if (p >= T.tapIn && p <= T.tapOut){
      var q = (p - T.tapIn) / (T.tapOut - T.tapIn);          // 0..1
      tapEl.style.opacity = 1;
      var ring = 0.25 + q * 1.7;
      tapRing.style.transform = 'scale(' + ring.toFixed(3) + ')';
      tapRing.style.opacity = (1 - Math.abs(q - 0.35) * 1.6).toFixed(3);
      tapDot.style.transform = 'translate(-50%,-50%) scale(' + (1 - q * 0.5).toFixed(3) + ')';
      tapDot.style.opacity = (q < 0.5 ? 1 : (1 - (q - 0.5) * 2)).toFixed(3);
    } else {
      tapEl.style.opacity = 0;
    }
  }
  window.setSceneTime = setSceneTime;

  // ---- modo captura plana (stills) ----
  // window.setStill({ screen:'mapa'|'rutas'|'perfil', scroll:0..1, pin:<n>, ficha:'expandida' })
  // el celular queda de frente (sin giro) y se muestra UNA pantalla a la altura de scroll pedida.
  //
  // 2026-09-22 — el cambio de pantalla/pin/ficha/scroll pasa por window.SurEnRuta.aplicar()
  // (docs/planes/2026-09-22-recomposicion-ui-vertical.md §14.2.a), la MISMA función que va a
  // comandar el demo por postMessage() en producción — no queda una segunda superficie de control
  // manipulando el DOM de adentro por su cuenta. Lo que se queda ACÁ (fuera de `aplicar()`) es
  // rigging propio de esta escena de filmación: el aire de 40px para la isla dinámica dibujada
  // encima (`#island`, vive en ESTE documento, no en el de adentro) y el fondo opaco de
  // `.pantalla` no son parte del contrato de `aplicar()` — son ajuste visual del video/capturas,
  // no un estado real que un consumidor de producción vaya a pedir nunca.
  var allPant = [];
  window.setStill = function(opts){
    opts = opts || {};
    var d = window.__doc;
    var w = d && d.defaultView;
    if (!d || !w || !w.SurEnRuta) return;
    phone.classList.add('plano');
    phone.style.transform = 'rotateX(0deg) rotateY(0deg) rotateZ(0deg)';
    glare.style.transform = 'translateX(-4%)';
    glare.style.opacity = '0.24';
    tapEl.style.opacity = 0;

    var target = opts.screen || 'mapa';

    w.SurEnRuta.aplicar({
      pantalla: target,
      scroll: opts.scroll || 0,
      pin: target === 'mapa' ? opts.pin : null,
      ficha: opts.ficha,
      animar: false,
    });

    // Aire para la isla dinámica (de este documento, no del de adentro) + fondo opaco — rigging
    // de la escena, no estado de la app (ver comentario grande de arriba). `transform:'none'`
    // TAMBIÉN es rigging, y es importante: el hook() de más abajo le pone `translateX(100%)`
    // inline a "rutas" para el modo recorrido (`scr.rutas.style.transform`, ver más abajo) — un
    // estilo inline le gana a cualquier regla de `.pantalla.activa` sin importar el orden en que
    // se apliquen, así que si no se limpia acá, "rutas" queda corrida 390px fuera de cuadro para
    // siempre, sin importar lo que diga `aplicar()` (encontrado en vivo: dos capturas de "rutas"
    // con scroll distinto salían bit a bit idénticas — las dos mostraban el hueco vacío de al lado).
    allPant.forEach(function(s){
      s.style.transform = 'none';
      s.style.filter = 'none';
      s.style.paddingTop = '40px';
      s.style.background = '#f1f0ee';
    });

    if (nav.mapa)  nav.mapa.classList.toggle('activo', target === 'mapa');
    if (nav.rutas) nav.rutas.classList.toggle('activo', target === 'rutas');
    var navPerfil = d.querySelector('.navbar__item[data-ir="perfil"]');
    if (navPerfil) navPerfil.classList.toggle('activo', target === 'perfil');
  };

  iframe.addEventListener('load', function(){
    var d, w;
    try { d = iframe.contentDocument; w = iframe.contentWindow; }
    catch(e){ console.error('showcase: sin acceso al iframe', e); window.__ready = true; return; }

    function hook(){
      try{
        var pre = d.getElementById('preloader');
        if (pre){ pre.classList.add('is-fuera'); pre.classList.add('is-oculto'); }
        var appEl = d.getElementById('app');
        if (appEl){ appEl.classList.add('visible'); appEl.style.opacity = '1'; }

        window.__doc = d;
        allPant = Array.prototype.slice.call(d.querySelectorAll('.pantalla'));
        scr.mapa  = d.querySelector('.pantalla[data-pantalla="mapa"]');
        scr.rutas = d.querySelector('.pantalla[data-pantalla="rutas"]');
        nav.mapa  = d.querySelector('.navbar__item[data-ir="mapa"]');
        nav.rutas = d.querySelector('.navbar__item[data-ir="rutas"]');
        // las dos pantallas del recorrido quedan montadas y "activa"; el crossfade lo maneja
        // setSceneTime por opacidad. Sin transición CSS → render reproducible.
        d.querySelectorAll('.pantalla').forEach(function(s){ s.classList.remove('activa'); });
        [scr.mapa, scr.rutas].forEach(function(s){
          if (!s) return;
          s.classList.add('activa');
          s.style.transition = 'none';
          s.style.paddingTop = '40px';   // aire para que la isla dinámica no tape el contenido
          s.style.background = '#f1f0ee'; // --fondo del mockup: cada pantalla OPACA, así no se
                                          // transparenta la otra durante el push
        });
        scr.rutas.style.transform = 'translateX(100%)';   // Rutas empieza fuera de cuadro, a la derecha

        var fontsReady = d.fonts ? d.fonts.ready : Promise.resolve();
        var settle = function(){
          maxS.mapa  = scr.mapa  ? (scr.mapa.scrollHeight  - scr.mapa.clientHeight)  : 0;
          maxS.rutas = scr.rutas ? (scr.rutas.scrollHeight - scr.rutas.clientHeight) : 0;
          setSceneTime(0);
          window.__ready = true;
        };
        Promise.resolve(fontsReady).then(function(){ setTimeout(settle, 250); });
        // red de seguridad: aunque el promise de fuentes no resuelva, marcar listo igual
        setTimeout(settle, 1500);
      } catch(e){ console.error('showcase hook error', e); window.__ready = true; }
    }

    if (d.readyState === 'complete') hook();
    else w.addEventListener('load', hook, { once:true });
  });

  // modo "transparente" (sin fondo horneado, para el scrub de P1, ver el bloque CSS de arriba) —
  // se agrega la clase temprano, antes de que nada se pinte.
  if (new URLSearchParams(location.search).get('fondo') === 'transparente') {
    document.documentElement.classList.add('fondo-transparente');
    document.body.classList.add('fondo-transparente');
  }

  // modo "vivo" para grabar a mano; con ?manual lo maneja el script de render
  var manual = new URLSearchParams(location.search).has('manual');
  if (!manual){
    var t0 = performance.now();
    (function loop(now){ setSceneTime((now - t0) / 1000); requestAnimationFrame(loop); })(performance.now());
  }
})();
</script>
</body>
</html>
